  groups:
  - id: "IDE"
    title: "Identify principles"
    props:
    - name: "sort-id"
      value: "2"
    groups:
    - id: "IDE-01"
      class: "essentials-principle"
      title: "IDE-01 - Asset identification"
      props:
      - name: "sort-id"
        value: "2.1"
      parts:
      - id: "IDE-01.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "2.1.1"
        - name: "label"
          value: "Principle"
        prose: "Systems (infrastructure, operating systems, applications, identities, credentials and data) are continually and centrally identified and documented."
      controls:
      - id: "IT.IDE-01.1"
        title: "IT.IDE-01.1"
        props:
        - name: "sort-id"
          value: "2.1.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.IDE-01.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "2.1.2.1"
          - name: "label"
            value: "Action"
          prose: "Use an approved asset inventory mechanism that supports automated discovery to detect new and changed physical and non-physical assets."
        - id: "IT.IDE-01.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "2.1.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "2.1.2.2.1"
            parts:
            - id: "IT.IDE-01.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.1.2.2.1.1"
              prose: "No approved asset inventory mechanism is in place."
            - id: "IT.IDE-01.1.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.1.2.2.1.2"
              prose: "Asset inventory records are maintained manually with no automated discovery capability."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "2.1.2.2.2"
            parts:
            - id: "IT.IDE-01.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.1.2.2.2.1"
              prose: "An approved asset inventory mechanism is deployed but does not cover all network segments or asset types."
            - id: "IT.IDE-01.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.1.2.2.2.2"
              prose: "Automated discovery scans to detect new and changed physical and non-physical assets occur on a schedule but reconciliation with the approved inventory is manual or inconsistent."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "2.1.2.2.3"
            parts:
            - id: "IT.IDE-01.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.1.2.2.3.1"
              prose: "An approved asset inventory mechanism which supports automated discovery is deployed to cover all applicable assets and network segments."
            - id: "IT.IDE-01.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.1.2.2.3.2"
              prose: "Discovery runs on a regular schedule defined by the organisation and new or changed physical or non-physical assets that are detected are reconciled with the approved inventory."
    - id: "IDE-04"
      class: "essentials-principle"
      title: "IDE-04 - Security risk identification"
      props:
      - name: "sort-id"
        value: "2.2"
      parts:
      - id: "IDE-04.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "2.2.1"
        - name: "label"
          value: "Principle"
        prose: "Security risks for an organisation and their systems (infrastructure, operating systems, applications and data) are identified, including by using current strategic and sector-specific cyber threat intelligence and threat modelling, and are documented along with any associated risk management decisions."
      controls:
      - id: "IT.IDE-04.1"
        title: "IT.IDE-04.1"
        props:
        - name: "sort-id"
          value: "2.2.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.IDE-04.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "2.2.2.1"
          - name: "label"
            value: "Action"
          prose: "Identify relevant weaknesses, malicious actor techniques and cyber threat behaviours when undertaking risk assessments and review these inputs on a continuous basis."
        - id: "IT.IDE-04.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "2.2.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "2.2.2.2.1"
            parts:
            - id: "IT.IDE-04.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.1.1"
              prose: "Risk assessments do not reference relevant weaknesses, malicious actor techniques and cyber threat behaviours."
            - id: "IT.IDE-04.1.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.1.2"
              prose: "No process exists to incorporate threat information into risk assessment activities."
            - id: "IT.IDE-04.1.NE-3"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.1.3"
              prose: "Current weaknesses, malicious actor techniques and cyber threat behaviours that are relevant to the organisation are not reviewed or updated."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "2.2.2.2.2"
            parts:
            - id: "IT.IDE-04.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.2.1"
              prose: "Risk assessments reference threat intelligence but coverage is limited to well-known or generic threats."
            - id: "IT.IDE-04.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.2.2"
              prose: "Threat information is considered but not systematically mapped to organisational assets or detection gaps."
            - id: "IT.IDE-04.1.PE-3"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.2.3"
              prose: "Current weaknesses, malicious actor techniques and cyber threat behaviours that are relevant to the organisation are reviewed or updated, but are not used to inform risk assessments or are reviewed only on an ad hoc basis."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "2.2.2.2.3"
            parts:
            - id: "IT.IDE-04.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.3.1"
              prose: "Risk assessments incorporate and reference relevant weaknesses, malicious actor techniques relevant to the sector, and cyber threat behaviours."
            - id: "IT.IDE-04.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.3.2"
              prose: "Relevant weaknesses, malicious actor techniques and cyber threat behaviours are systematically related to applicable assets and used to inform risk treatment decisions."
            - id: "IT.IDE-04.1.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "2.2.2.2.3.3"
              prose: "Current weaknesses, malicious actor techniques and cyber threat behaviours relevant to the organisation are reviewed or updated on a continuous basis at a frequency that enables noted changes to inform risk assessments."
  - id: "PRO"
    title: "Protect principles"
    props:
    - name: "sort-id"
      value: "3"
    groups:
    - id: "PRO-13"
      class: "essentials-principle"
      title: "PRO-13 - Identity, credential and access management"
      props:
      - name: "sort-id"
        value: "3.03"
      parts:
      - id: "PRO-13.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "3.03.1"
        - name: "label"
          value: "Principle"
        prose: "Robust and secure identity, credential and access management is used to establish, maintain and control access to systems (infrastructure, operating systems, applications and data) and to support effective detection of identity and credential misuse."
      controls:
      - id: "IT.PRO-13.3"
        title: "IT.PRO-13.3"
        props:
        - name: "sort-id"
          value: "3.03.4"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        links:
        - href: "#77ba96d0-f819-580a-9622-c823aba0d750"
          rel: "mitigated-technique"
          text: "Mitigated technique: Valid Accounts"
        - href: "#57fa3c84-e383-5a76-a1ac-8db584b1b7cb"
          rel: "mitigated-technique"
          text: "Mitigated technique: Unsecured Credentials"
        parts:
        - id: "IT.PRO-13.3.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "3.03.4.1"
          - name: "label"
            value: "Action"
          prose: "Identify and remediate unsecured keys, secrets and credentials by regularly scanning codebases, configuration files, file shares and user collaboration platforms."
        - id: "IT.PRO-13.3.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "3.03.4.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "3.03.4.2.1"
            parts:
            - id: "IT.PRO-13.3.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.1.1"
              prose: "No secret scanning capability is deployed."
            - id: "IT.PRO-13.3.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.1.2"
              prose: "No process exists to identify credentials exposed in codebases, configuration files, file shares or user collaboration platforms."
            - id: "IT.PRO-13.3.NE-3"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.1.3"
              prose: "Unsecured keys, secrets and credentials found exposed in codebases, configuration files, scripts, file shares or user collaboration platforms are left in place with no action taken."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "3.03.4.2.2"
            parts:
            - id: "IT.PRO-13.3.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.2.1"
              prose: "Secret scanning is deployed but does not cover all repositories, pipelines or user collaboration platforms."
            - id: "IT.PRO-13.3.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.2.2"
              prose: "Scanning runs but discovered credentials are not assessed in a timely manner."
            - id: "IT.PRO-13.3.PE-3"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.2.3"
              prose: "Unsecured keys, secrets and credentials that are discovered are assessed, but are not rotated or revoked in a timely manner."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "3.03.4.2.3"
            parts:
            - id: "IT.PRO-13.3.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.3.1"
              prose: "Secret scanning tooling is deployed across codebases, configuration files, file shares and user collaboration platforms."
            - id: "IT.PRO-13.3.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.3.2"
              prose: "Scans to identify unsecured keys, secrets and credentials run on a regular schedule defined by the organisation."
            - id: "IT.PRO-13.3.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "3.03.4.2.3.3"
              prose: "Unsecured keys, secrets and credentials that are discovered are assessed, then rotated and/or revoked within timeframes defined by the organisation."
  - id: "DET"
    title: "Detect principles"
    props:
    - name: "sort-id"
      value: "4"
    groups:
    - id: "DET-01"
      class: "essentials-principle"
      title: "DET-01 - Centralised event logging"
      props:
      - name: "sort-id"
        value: "4.1"
      parts:
      - id: "DET-01.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "4.1.1"
        - name: "label"
          value: "Principle"
        prose: "Security-relevant event logs and configuration changes for systems (infrastructure, operating systems, applications and data) are centrally collected, protected against unauthorised modification or deletion, and retained to support effective cyber security event detection and investigation."
      controls:
      - id: "IT.DET-01.3"
        title: "IT.DET-01.3"
        props:
        - name: "sort-id"
          value: "4.1.4"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        links:
        - href: "#46785cc3-484c-58a6-aae3-b25173f54a61"
          rel: "mitigated-technique"
          text: "Mitigated technique: Indicator Removal"
        - href: "#7b9a147e-3ff0-575d-bd46-8175e912f663"
          rel: "mitigated-technique"
          text: "Mitigated technique: Disable or Modify Tools"
        parts:
        - id: "IT.DET-01.3.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "4.1.4.1"
          - name: "label"
            value: "Action"
          prose: "Establish a centralised event log storage capability that protects logs from unauthorised access or modification."
        - id: "IT.DET-01.3.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "4.1.4.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "4.1.4.2.1"
            parts:
            - id: "IT.DET-01.3.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.1.1"
              prose: "No centralised capability exists for storing event logs collected from systems across the environment."
            - id: "IT.DET-01.3.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.1.2"
              prose: "Stored logs have no protection against modification or deletion by administrators of the systems generating them."
            - id: "IT.DET-01.3.NE-3"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.1.3"
              prose: "Access to the centralised capability is not restricted, or access is granted to roles without a documented need."
            - id: "IT.DET-01.3.NE-4"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.1.4"
              prose: "Log retention requirements are not defined."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "4.1.4.2.2"
            parts:
            - id: "IT.DET-01.3.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.2.1"
              prose: "A centralised capability exists but does not receive logs from in-scope systems, or coverage is inconsistent."
            - id: "IT.DET-01.3.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.2.2"
              prose: "Stored logs are protected from modification, but the controls do not consistently prevent deletion, or controls are not applied to all log types."
            - id: "IT.DET-01.3.PE-3"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.2.3"
              prose: "Access is restricted to a defined set of roles but access is not logged or monitored."
            - id: "IT.DET-01.3.PE-4"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.2.4"
              prose: "A retention period is defined but is inconsistently applied, or some log types are retained for shorter periods than required."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "4.1.4.2.3"
            parts:
            - id: "IT.DET-01.3.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.3.1"
              prose: "A centralised event log storage capability is in place for logs collected from in-scope systems."
            - id: "IT.DET-01.3.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.3.2"
              prose: "Stored logs are protected against unauthorised access, modification and deletion through technical controls including access restrictions, encryption at rest and integrity protection."
            - id: "IT.DET-01.3.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.3.3"
              prose: "Access to the centralised capability is restricted to security operations personnel and other roles with a documented need, with access logged and monitored."
            - id: "IT.DET-01.3.FE-4"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.1.4.2.3.4"
              prose: "Log retention requirements are defined and aligned to investigative, regulatory and contractual obligations, with retention applied consistently across log types."
    - id: "DET-02"
      class: "essentials-principle"
      title: "DET-02 - Cyber security event detection"
      props:
      - name: "sort-id"
        value: "4.3"
      parts:
      - id: "DET-02.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "4.3.1"
        - name: "label"
          value: "Principle"
        prose: "Anomalous or unexpected events and behaviours for systems (infrastructure, operating systems, applications and data) are analysed in a timely manner to detect cyber security events."
      controls:
      - id: "IT.DET-02.2"
        title: "IT.DET-02.2"
        props:
        - name: "sort-id"
          value: "4.3.3"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.DET-02.2.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "4.3.3.1"
          - name: "label"
            value: "Action"
          prose: "Ensure detection logic identifies unauthorised changes, anomalous authentication activity and suspicious software execution."
        - id: "IT.DET-02.2.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "4.3.3.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "4.3.3.2.1"
            parts:
            - id: "IT.DET-02.2.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.1.1"
              prose: "No detection logic is deployed to identify unauthorised changes, anomalous authentication activity or suspicious software execution events originating from assets."
            - id: "IT.DET-02.2.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.1.2"
              prose: "Detection relies entirely on manual log review with no automated rules or alerting."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "4.3.3.2.2"
            parts:
            - id: "IT.DET-02.2.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.2.1"
              prose: "Detection logic exists but does not cover all three categories (unauthorised changes, anomalous authentication, suspicious execution)."
            - id: "IT.DET-02.2.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.2.2"
              prose: "Rules are deployed but are not tested or tuned on a regular cycle defined by the organisation."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "4.3.3.2.3"
            parts:
            - id: "IT.DET-02.2.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.3.1"
              prose: "Detection logic is deployed, and unauthorised configuration changes, anomalous authentication patterns and suspicious process execution events are captured and produce alerts."
            - id: "IT.DET-02.2.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.3.2"
              prose: "Detection logic is tested and tuned on a regular cycle defined by the organisation to maintain effectiveness."
            - id: "IT.DET-02.2.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.3.3.2.3.3"
              prose: "Detection coverage is reviewed following cyber security incidents or significant environmental changes."
    - id: "DET-03"
      class: "essentials-principle"
      title: "DET-03 - Cyber security incident identification"
      props:
      - name: "sort-id"
        value: "4.4"
      parts:
      - id: "DET-03.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "4.4.1"
        - name: "label"
          value: "Principle"
        prose: "Cyber security events are analysed in a timely manner to identify cyber security incidents."
      controls:
      - id: "IT.DET-03.1"
        title: "IT.DET-03.1"
        props:
        - name: "sort-id"
          value: "4.4.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.DET-03.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "4.4.2.1"
          - name: "label"
            value: "Action"
          prose: "Triage alerts and events in a timely manner to determine whether cyber security incident thresholds have been met."
        - id: "IT.DET-03.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "4.4.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "4.4.2.2.1"
            parts:
            - id: "IT.DET-03.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.1.1"
              prose: "No documented triage process exists."
            - id: "IT.DET-03.1.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.1.2"
              prose: "Alerts are routinely ignored or left unreviewed."
            - id: "IT.DET-03.1.NE-3"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.1.3"
              prose: "No incident severity thresholds are defined."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "4.4.2.2.2"
            parts:
            - id: "IT.DET-03.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.2.1"
              prose: "A triage process exists but response times are not defined or consistently met."
            - id: "IT.DET-03.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.2.2"
              prose: "Severity thresholds are defined but escalation procedures are informal."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "4.4.2.2.3"
            parts:
            - id: "IT.DET-03.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.3.1"
              prose: "A documented triage process with defined severity thresholds and response timeframes is in place."
            - id: "IT.DET-03.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.3.2"
              prose: "Alerts are triaged within the timeframes defined by the organisation and escalated where cyber security incident thresholds are met."
            - id: "IT.DET-03.1.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.2.2.3.3"
              prose: "Triage performance is tracked and reported."
      - id: "IT.DET-03.2"
        title: "IT.DET-03.2"
        props:
        - name: "sort-id"
          value: "4.4.3"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.DET-03.2.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "4.4.3.1"
          - name: "label"
            value: "Action"
          prose: "Use indicators from across identities, applications, data and infrastructure activity rather than isolated signals when identifying cyber security incidents."
        - id: "IT.DET-03.2.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "4.4.3.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "4.4.3.2.1"
            parts:
            - id: "IT.DET-03.2.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.3.2.1.1"
              prose: "Investigation relies on single-source alerts with no cross-source correlation."
            - id: "IT.DET-03.2.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.3.2.1.2"
              prose: "Correlation rules do not consider signals from multiple data sources."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "4.4.3.2.2"
            parts:
            - id: "IT.DET-03.2.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.3.2.2.1"
              prose: "Some correlation exists but is limited to specific data source pairs."
            - id: "IT.DET-03.2.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.3.2.2.2"
              prose: "Cross-source investigation is performed manually but not supported by automated correlation."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "4.4.3.2.3"
            parts:
            - id: "IT.DET-03.2.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.3.2.3.1"
              prose: "Correlation rules and investigation procedures consider signals across identities, applications, data and infrastructure."
            - id: "IT.DET-03.2.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.4.3.2.3.2"
              prose: "Automated correlation supports detection of multi-stage adversary activity."
    - id: "DET-05"
      class: "essentials-principle"
      title: "DET-05 - Detection capability efficacy"
      props:
      - name: "sort-id"
        value: "4.5"
      parts:
      - id: "DET-05.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "4.5.1"
        - name: "label"
          value: "Principle"
        prose: "Cyber security event detection capabilities are regularly evaluated for effectiveness and continuously refined, including by using current strategic and sector-specific cyber threat intelligence, to improve the detection of cyber security events."
      controls:
      - id: "IT.DET-05.1"
        title: "IT.DET-05.1"
        props:
        - name: "sort-id"
          value: "4.5.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.DET-05.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "4.5.2.1"
          - name: "label"
            value: "Action"
          prose: "Review detection coverage periodically to identify gaps arising from new assets, services or architectural changes."
        - id: "IT.DET-05.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "4.5.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "4.5.2.2.1"
            parts:
            - id: "IT.DET-05.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.1.1"
              prose: "No review of detection coverage has been conducted within the period defined by the organisation."
            - id: "IT.DET-05.1.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.1.2"
              prose: "No process exists to assess new assets and services for log coverage or detection applicability."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "4.5.2.2.2"
            parts:
            - id: "IT.DET-05.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.2.1"
              prose: "A review of detection coverage has been conducted but does not cover all recently deployed assets or services."
            - id: "IT.DET-05.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.2.2"
              prose: "Detection gaps have been identified and remediation is planned, but remediation has not been executed within timeframes defined by the organisation."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "4.5.2.2.3"
            parts:
            - id: "IT.DET-05.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.3.1"
              prose: "A detection coverage review has been completed within the cycle defined by the organisation."
            - id: "IT.DET-05.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.3.2"
              prose: "New assets and services are assessed for log coverage and detection rule applicability."
            - id: "IT.DET-05.1.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "4.5.2.2.3.3"
              prose: "Identified detection gaps are remediated within risk-based timeframes defined by the organisation."
  - id: "RES"
    title: "Respond principles"
    props:
    - name: "sort-id"
      value: "5"
    groups:
    - id: "RES-05"
      class: "essentials-principle"
      title: "RES-05 - Cyber security incident coordination"
      props:
      - name: "sort-id"
        value: "5.1"
      parts:
      - id: "RES-05.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "5.1.1"
        - name: "label"
          value: "Principle"
        prose: "Cyber security incident roles and responsibilities are defined, documented and exercised to support the internal and external coordination and management of cyber security incidents, including responsibilities for declaring cyber security incidents and undertaking pre-approved response and recovery activities."
      controls:
      - id: "IT.RES-05.1"
        title: "IT.RES-05.1"
        props:
        - name: "sort-id"
          value: "5.1.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.RES-05.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "5.1.2.1"
          - name: "label"
            value: "Action"
          prose: "Integrate external coordination obligations into cyber security incident response activities where required."
        - id: "IT.RES-05.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "5.1.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "5.1.2.2.1"
            parts:
            - id: "IT.RES-05.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.1.1"
              prose: "External coordination requirements for Cyber security incident response activities are neither identified nor documented."
            - id: "IT.RES-05.1.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.1.2"
              prose: "No defined triggers, contacts or timeframes exist for external reporting."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "5.1.2.2.2"
            parts:
            - id: "IT.RES-05.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.2.1"
              prose: "External coordination requirements are documented but are not integrated into operational response procedures."
            - id: "IT.RES-05.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.2.2"
              prose: "Contacts and triggers are defined for some but not all required external parties."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "5.1.2.2.3"
            parts:
            - id: "IT.RES-05.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.3.1"
              prose: "Cyber security incident response procedures include documented external coordination requirements with defined triggers, contacts and timeframes."
            - id: "IT.RES-05.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.3.2"
              prose: "Requirements cover all relevant external parties identified by applicable legal, regulatory, contractual and organisational obligations."
            - id: "IT.RES-05.1.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.1.2.2.3.3"
              prose: "Coordination procedures have been exercised or invoked and lessons learnt have been incorporated."
    - id: "RES-03"
      class: "essentials-principle"
      title: "RES-03 - Cyber security incident response"
      props:
      - name: "sort-id"
        value: "5.2"
      parts:
      - id: "RES-03.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "5.2.1"
        - name: "label"
          value: "Principle"
        prose: "Cyber security incidents are contained, eradicated and recovered from in a timely manner."
      controls:
      - id: "IT.RES-03.1"
        title: "IT.RES-03.1"
        props:
        - name: "sort-id"
          value: "5.2.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.RES-03.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "5.2.2.1"
          - name: "label"
            value: "Action"
          prose: "Use documented, tested and approved cyber security incident response procedures when responding to cyber security incidents."
        - id: "IT.RES-03.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "5.2.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "5.2.2.2.1"
            parts:
            - id: "IT.RES-03.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.1.1"
              prose: "No documented cyber security incident response plan or procedures exist."
            - id: "IT.RES-03.1.NE-2"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.1.2"
              prose: "Incident response activities are conducted on an ad hoc basis without any defined roles, escalation paths, procedures or response objectives."
            - id: "IT.RES-03.1.NE-3"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.1.3"
              prose: "Available incident records demonstrate systemic failures to contain, eradicate or recover from cyber security incidents within organisationally defined timeframes, and the causes of these failures are not addressed."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "5.2.2.2.2"
            parts:
            - id: "IT.RES-03.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.2.1"
              prose: "A cyber security incident response plan exists but has not been exercised or invoked within the organisationally defined test cycle."
            - id: "IT.RES-03.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.2.2"
              prose: "The cyber security incident response plan defines roles, escalation paths, and response procedures, but target timeframes or intended response outcomes are not clearly defined."
            - id: "IT.RES-03.1.PE-3"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.2.3"
              prose: "Incident records or exercise results demonstrate that response activities do not consistently meet organisationally defined timeframes or intended outcomes, but identified deficiencies are documented and subject to improvement actions."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "5.2.2.2.3"
            parts:
            - id: "IT.RES-03.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.3.1"
              prose: "An approved cyber security incident response plan is in place and defines roles, escalation paths, response procedures, target timeframes and intended containment, eradication and recovery outcomes."
            - id: "IT.RES-03.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.3.2"
              prose: "The incident response plan and associated procedures have been exercised or invoked within the organisationally defined test cycle."
            - id: "IT.RES-03.1.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.3.3"
              prose: "Incident records demonstrate that cyber security incidents are contained, eradicated and recovered from within organisationally defined target timeframes and achieve the intended response outcomes, taking into account incident severity, complexity and business impact."
            - id: "IT.RES-03.1.FE-4"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.3.4"
              prose: "Where target timeframes or intended outcomes are not achieved, the causes are analysed, improvement actions are assigned and tracked, and relevant plans, procedures and controls are updated."
            - id: "IT.RES-03.1.FE-5"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.2.2.2.3.5"
              prose: "Where no relevant cyber security incident has occurred during the assessment period, appropriately scoped exercises demonstrate the organisation’s capability to achieve its target timeframes and intended response outcomes."
    - id: "RES-04"
      class: "essentials-principle"
      title: "RES-04 - Cyber security incident insights"
      props:
      - name: "sort-id"
        value: "5.3"
      parts:
      - id: "RES-04.overview"
        name: "overview"
        props:
        - name: "sort-id"
          value: "5.3.1"
        - name: "label"
          value: "Principle"
        prose: "Lessons learnt from cyber security incidents are captured, and areas for improvement are identified, prioritised and actioned in a timely manner."
      controls:
      - id: "IT.RES-04.1"
        title: "IT.RES-04.1"
        props:
        - name: "sort-id"
          value: "5.3.2"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.RES-04.1.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "5.3.2.1"
          - name: "label"
            value: "Action"
          prose: "Perform post-cyber security incident reviews to identify the security gaps that enabled each stage of the cyber security incident."
        - id: "IT.RES-04.1.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "5.3.2.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "5.3.2.2.1"
            parts:
            - id: "IT.RES-04.1.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.2.2.1.1"
              prose: "Post-incident reviews are not conducted."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "5.3.2.2.2"
            parts:
            - id: "IT.RES-04.1.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.2.2.2.1"
              prose: "Post-incident reviews are conducted for some incidents but not all that meet the severity threshold defined by the organisation."
            - id: "IT.RES-04.1.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.2.2.2.2"
              prose: "Reviews are conducted but findings are not documented or actioned."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "5.3.2.2.3"
            parts:
            - id: "IT.RES-04.1.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.2.2.3.1"
              prose: "Post-incident reviews are conducted for all incidents meeting the severity threshold defined by the organisation."
            - id: "IT.RES-04.1.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.2.2.3.2"
              prose: "Findings identify the specific gaps that enabled each stage of the incident."
            - id: "IT.RES-04.1.FE-3"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.2.2.3.3"
              prose: "Remediation actions arising from findings are implemented and tracked to closure."
      - id: "IT.RES-04.2"
        title: "IT.RES-04.2"
        props:
        - name: "sort-id"
          value: "5.3.3"
        - name: "domain"
          ns: "https://www.cyber.gov.au/ns/essentials/oscal/1.0"
          value: "visibility-and-response"
        parts:
        - id: "IT.RES-04.2.action"
          name: "statement"
          class: "essentials-action"
          props:
          - name: "sort-id"
            value: "5.3.3.1"
          - name: "label"
            value: "Action"
          prose: "Evaluate the monitoring coverage and cyber security incident response procedures following cyber security incidents."
        - id: "IT.RES-04.2.indicators-of-good-practice"
          name: "statement"
          class: "indicators-of-good-practice"
          title: "Indicators of Good Practice"
          props:
          - name: "sort-id"
            value: "5.3.3.2"
          parts:
          - name: "item"
            class: "indicator-group"
            title: "Not effective"
            props:
            - name: "sort-id"
              value: "5.3.3.2.1"
            parts:
            - id: "IT.RES-04.2.NE-1"
              name: "item"
              class: "not-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.3.2.1.1"
              prose: "Detection rules, monitoring coverage and response procedures are not reviewed following incidents."
          - name: "item"
            class: "indicator-group"
            title: "Partially effective"
            props:
            - name: "sort-id"
              value: "5.3.3.2.2"
            parts:
            - id: "IT.RES-04.2.PE-1"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.3.2.2.1"
              prose: "Reviews are conducted but do not result in documented changes to detection or response capabilities."
            - id: "IT.RES-04.2.PE-2"
              name: "item"
              class: "partially-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.3.2.2.2"
              prose: "Some improvements are made but not systematically tracked or validated."
          - name: "item"
            class: "indicator-group"
            title: "Fully effective"
            props:
            - name: "sort-id"
              value: "5.3.3.2.3"
            parts:
            - id: "IT.RES-04.2.FE-1"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.3.2.3.1"
              prose: "Detection rules, monitoring coverage and cyber security incident response procedures are reviewed following incidents, with identified lessons incorporated into updates."
            - id: "IT.RES-04.2.FE-2"
              name: "item"
              class: "fully-effective-indicator-statement"
              props:
              - name: "sort-id"
                value: "5.3.3.2.3.2"
              prose: "Changes are documented, tested and validated for effectiveness."
